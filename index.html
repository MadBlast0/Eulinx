<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eulinx</title>

    <!-- Font preloads for performance -->
    <link rel="preload" href="/fonts/GeistVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Boot cloak: hides blank white flash until theme is applied -->
    <style>
      /* @font-face inlined here so the browser discovers font usage
         immediately during HTML parsing — preloads are consumed right away. */
      @font-face {
        font-family: "Geist Variable";
        src: url("/fonts/GeistVariable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/JetBrainsMono-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      #eulinx-boot-cloak {
        position: fixed;
        inset: 0;
        background: #0F1115;
        z-index: 9999;
        transition: opacity 200ms ease;
        pointer-events: none;
      }
      #eulinx-boot-cloak[data-hidden] {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="eulinx-boot-cloak"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
